name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: Also run the full Build.ps1 -Check (Rust release build, ~10 min)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request supersedes its running checks. Pushes, tags and manual runs never cancel each other.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cargo: ${{ steps.changes.outputs.cargo }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out its merge commit; the first parent is the base branch.
          fetch-depth: 2

      # cargo check reads desktop/ and, through tauri's frontendDist, web/. Pull requests that touch neither (nor this
      # workflow) skip it; pushes, tags and manual runs always run it.
      - name: Does this change reach cargo check
        id: changes
        shell: bash
        run: |
          if [ '${{ github.event_name }}' = pull_request ] && git diff --quiet HEAD^1 HEAD -- desktop web .github/workflows/ci.yml; then
            echo cargo=false >> "$GITHUB_OUTPUT"
          else
            echo cargo=true >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node --check every script
        shell: bash
        run: |
          find web services core tools validation -type f \( -iname '*.js' -o -iname '*.cjs' -o -iname '*.mjs' \) \
            -not -path '*/node_modules/*' -print0 > "$RUNNER_TEMP/js-files"
          count=$(tr -cd '\0' < "$RUNNER_TEMP/js-files" | wc -c)
          if [ "$count" -eq 0 ]; then echo 'No JavaScript files found'; exit 1; fi
          # .js files are either classic scripts or ES modules: accept the file if it parses as either.
          check='node --check "$1" 2>/dev/null && exit 0
            case "$1" in
              *.js|*.JS) copy="$RUNNER_TEMP/$(basename "$1").$$.mjs"; cp "$1" "$copy"; node --check "$copy" && exit 0;;
              *) node --check "$1";;
            esac
            echo "::error file=$1::Syntax error"; exit 1'
          if xargs -0 -n 1 -P "$(nproc)" bash -c "$check" _ < "$RUNNER_TEMP/js-files"; then
            echo "Checked $count files"
          else
            echo "Checked $count files; see the errors above"; exit 1
          fi

  native:
    name: Native helpers (cached by source)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The binaries depend only on native/, the build steps below and the runner image (its Visual Studio and .NET).
      # A hit restores binaries that were built and self-tested from exactly these inputs, so the build is skipped.
      - name: Runner image
        id: image
        shell: pwsh
        run: '"id=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT'

      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            native/**/*.dll
            native/**/*.exe
          key: native-${{ steps.image.outputs.id }}-${{ hashFiles('native/**', '.github/workflows/ci.yml') }}

      - name: C# helpers (.NET Framework csc)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:exe /optimize+ /out:native\GameProcess.exe native\GameProcess.cs; if ($LASTEXITCODE) { throw 'GameProcess' }
          & $csc /nologo /target:exe /optimize+ /platform:x86 /out:native\HookInjector32.exe native\HookInjector.cs native\HookTarget.cs; if ($LASTEXITCODE) { throw 'HookInjector32' }
          & $csc /nologo /target:exe /optimize+ /platform:x64 /out:native\HookInjector64.exe native\HookInjector.cs native\HookTarget.cs; if ($LASTEXITCODE) { throw 'HookInjector64' }
          & $csc /nologo /target:exe /optimize+ /reference:System.Security.dll /out:native\KeyVault.exe native\KeyVault.cs; if ($LASTEXITCODE) { throw 'KeyVault' }

      - name: Native DLLs from native/native-builds.json (MSVC) with self-tests and staleness check
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # E667: the shipped native DLLs are untracked; beta37/38 packaged MeguLitFont/MeguLitHook32 builds older than their
          # sources. Every entry marked "ci" is built and self-tested here (the font DLL test only checks its version export
          # when the runner has no Japanese font); entries needing a tree that is not in the repository (the LunaHook source
          # of MeguLitHook32, GalWindowBridge's WinRT metadata) are built by Build.ps1 and checked by tools/native-stale.cjs.
          # The DirectPlay decline DLLs that validation/directplay.test.cjs reads are one of the "ci" entries.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio with the C++ toolset on this runner' }
          $env:MEGULIT_VS = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $env:MEGULIT_VS_X86 = 'none'
          foreach ($nb in (Get-Content native\native-builds.json -Raw | ConvertFrom-Json)) {
            if (-not $nb.ci) { continue }
            & cmd /c ($nb.build -replace '/', '\')
            if ($LASTEXITCODE) { throw "native build failed: $($nb.name)" }
            foreach ($o in $nb.outputs) { if (-not (Test-Path $o)) { throw "$($nb.build) did not produce $o" } }
            foreach ($t in @($nb.selftests)) {
              if (-not $t) { continue }
              if ($t -like '*.ps1') { & pwsh -NoProfile -File $t } else { & cmd /c ($t -replace '/', '\') }
              if ($LASTEXITCODE) { throw "native self-test failed: $($nb.name) ($t)" }
            }
          }
          node tools/native-stale.cjs --ci
          if ($LASTEXITCODE) { throw 'a native binary is older than its sources' }

      - name: Hook bridge (Roslyn) with self-test
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./native/Build-HookBridge.ps1 -OutputPath native/HookBridge.exe

      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            native/**/*.dll
            native/**/*.exe
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: |
            native/**/*.dll
            native/**/*.exe
          if-no-files-found: error
          retention-days: 3

  cargo:
    name: cargo check
    needs: syntax
    if: needs.syntax.outputs.cargo == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: cargo fetch + check
        shell: pwsh
        run: |
          cargo fetch --locked --manifest-path desktop/Cargo.toml
          cargo check --locked --manifest-path desktop/Cargo.toml

  tests:
    name: Tests (shard ${{ matrix.shard }}/3)
    # Waits for the cheap syntax check so that a broken script does not occupy three Windows runners.
    needs: [syntax, native]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install relay test dependencies
        working-directory: relay
        run: npm ci --ignore-scripts --include=dev

      - uses: actions/download-artifact@v4
        with:
          name: native-binaries
          path: native

      # validation/reader-bootstrap.test.cjs reads tauri's core.js from the locked crate in a Cargo registry. Unpack only
      # that crate, checked against its Cargo.lock checksum, instead of installing Rust and fetching every dependency.
      - name: Locked tauri crate
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content desktop/Cargo.lock -Raw), 'name = "tauri"\s+version = "([^"]+)"\s+source = "registry\+https://github\.com/rust-lang/crates\.io-index"\s+checksum = "([0-9a-f]{64})"')
          if (-not $m.Success) { throw 'desktop/Cargo.lock has no crates.io tauri package' }
          $version = $m.Groups[1].Value
          $crate = Join-Path $env:RUNNER_TEMP "tauri-$version.crate"
          Invoke-WebRequest "https://static.crates.io/crates/tauri/tauri-$version.crate" -OutFile $crate
          if ((Get-FileHash $crate -Algorithm SHA256).Hash -ne $m.Groups[2].Value) { throw "tauri-$version.crate does not match its Cargo.lock checksum" }
          $cargoHome = Join-Path $env:RUNNER_TEMP 'cargo'
          $src = Join-Path $cargoHome 'registry\src\index.crates.io'
          New-Item -ItemType Directory -Force $src | Out-Null
          tar -xzf $crate -C $src
          if ($LASTEXITCODE) { throw "could not unpack tauri-$version.crate" }
          if (-not (Test-Path (Join-Path $src "tauri-$version\scripts\core.js"))) { throw "tauri-$version has no scripts/core.js" }
          "CARGO_HOME=$cargoHome" >> $env:GITHUB_ENV

      - name: Unit and integration tests
        shell: pwsh
        run: |
          $env:MEGULIT_ROSLYN_CSC = ./native/Build-HookBridge.ps1 -CompilerPathOnly
          # Use the real temp path for fixtures that reject redirected paths.
          $env:TEMP = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $env:TEMP -PathType Container)) { throw 'Could not resolve test temp directory' }
          $env:TMP = $env:TEMP
          # Every runner needs the same parallelism to compute the same shard plan.
          $parallelism = 3
          $plan = node tools/test-shards.cjs --plan ${{ matrix.shard }} 3 $parallelism | ConvertFrom-Json
          if ($LASTEXITCODE -or -not $plan) { throw 'Failed to compute shard plan' }
          $replay = @($plan.replay | ForEach-Object { $_.Replace('/', '\') })
          $browser = @($plan.browser | ForEach-Object { $_.Replace('/', '\') })
          $isolatedFiles = @('validation/torch-revocation-cli.test.cjs', 'validation/unity-kemco-snapshot.test.cjs')
          $isolated = @($plan.standard | Where-Object { $_ -in $isolatedFiles } | ForEach-Object { $_.Replace('/', '\') })
          $standard = @($plan.standard | Where-Object { $_ -notin $isolatedFiles } | ForEach-Object { $_.Replace('/', '\') })
          if (($replay.Count + $browser.Count + $isolated.Count + $standard.Count) -eq 0) { throw 'No tests in this shard' }

          $nodeExe = (Get-Command node).Source
          function Quote-WinArg([string]$arg) {
            if ($arg -eq '' -or $arg -match '[\s"]') {
              return '"' + ($arg -replace '(\\*)"', '$1$1\"' -replace '(\\+)$', '$1$1') + '"'
            }
            return $arg
          }
          function Start-BackgroundBatch([string]$name, [string[]]$files, [int]$concurrency) {
            $outFile = Join-Path $env:RUNNER_TEMP "test-batch-$name.out"
            $errFile = Join-Path $env:RUNNER_TEMP "test-batch-$name.err"
            $timeFile = Join-Path $env:RUNNER_TEMP "test-file-times-$name.json"
            Remove-Item -LiteralPath $outFile, $errFile, $timeFile -Force -ErrorAction SilentlyContinue
            $nodeArgs = @(
              '--test', '--test-force-exit', "--test-concurrency=$concurrency",
              '--test-reporter=tap', '--test-reporter-destination=stdout',
              '--test-reporter=./tools/test-file-times.mjs', "--test-reporter-destination=$timeFile"
            ) + $files
            $argString = ($nodeArgs | ForEach-Object { Quote-WinArg $_ }) -join ' '
            $proc = Start-Process -FilePath $nodeExe -ArgumentList $argString `
              -NoNewWindow -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            $null = $proc.Handle
            return [pscustomobject]@{ Name = $name; Process = $proc; Out = $outFile; Err = $errFile; Timings = $timeFile }
          }

          $failed = $false
          $count = 0
          $timings = @{}
          $batchErrors = [System.Collections.Generic.List[string]]::new()
          Set-Content -LiteralPath test-output.txt -Value '' -NoNewline

          function Record-BatchResult([string]$name, [int]$exitCode, [string]$outText, [string]$timeFile) {
            if ($exitCode -ne 0) { $script:failed = $true }
            $m = [regex]::Match($outText, '(?m)^(?:#|ℹ) tests (\d+)')
            if (-not $m.Success -or [int]$m.Groups[1].Value -eq 0) {
              $script:batchErrors.Add("Test runner ($name) reported zero tests")
            } else {
              $script:count += [int]$m.Groups[1].Value
            }
            if (Test-Path -LiteralPath $timeFile) {
              $rawTimes = Get-Content -LiteralPath $timeFile -Raw -Encoding utf8
              if (-not [string]::IsNullOrWhiteSpace($rawTimes)) {
                $batchObj = $rawTimes | ConvertFrom-Json
                foreach ($prop in $batchObj.PSObject.Properties) { $script:timings[$prop.Name] = $prop.Value }
              } elseif ($exitCode -eq 0) {
                $script:batchErrors.Add("Test runner ($name) wrote empty timings file")
              }
            } elseif ($exitCode -eq 0) {
              $script:batchErrors.Add("Test runner ($name) wrote no timings file")
            }
          }

          function Invoke-ForegroundBatch([string]$name, [string[]]$files, [int]$concurrency) {
            $timeFile = Join-Path $env:RUNNER_TEMP "test-file-times-$name.json"
            Remove-Item -LiteralPath $timeFile -Force -ErrorAction SilentlyContinue
            $batchOutput = $null
            & node --test --test-force-exit "--test-concurrency=$concurrency" `
              --test-reporter=tap --test-reporter-destination=stdout `
              --test-reporter=./tools/test-file-times.mjs "--test-reporter-destination=$timeFile" `
              @files 2>&1 | Tee-Object -Variable batchOutput | Tee-Object -FilePath test-output.txt -Append
            $exitCode = if ($null -eq $LASTEXITCODE) { 1 } else { [int]$LASTEXITCODE }
            $outText = if ($batchOutput) { ($batchOutput | ForEach-Object { $_.ToString() }) -join "`n" } else { '' }
            Record-BatchResult $name $exitCode $outText $timeFile
          }

          function Complete-BackgroundBatch($job) {
            $job.Process.WaitForExit()
            $rawOut = if (Test-Path -LiteralPath $job.Out) { Get-Content -LiteralPath $job.Out -Raw -Encoding utf8 } else { '' }
            $rawErr = if (Test-Path -LiteralPath $job.Err) { Get-Content -LiteralPath $job.Err -Raw -Encoding utf8 } else { '' }
            $outText = if ($null -eq $rawOut) { '' } else { [string]$rawOut }
            $errText = if ($null -eq $rawErr) { '' } else { [string]$rawErr }
            $combined = $outText + $(if ($errText) { "`n$errText" } else { '' })
            if ($combined) {
              Write-Output $combined
              Add-Content -LiteralPath test-output.txt -Value $combined -Encoding utf8
            }
            $exitCode = if ($null -eq $job.Process.ExitCode) { 1 } else { [int]$job.Process.ExitCode }
            Record-BatchResult $job.Name $exitCode $outText $job.Timings
          }

          # Compile the KEMCO snapshot harness before starting competing test workers.
          $kemcoSnapshot = 'validation\unity-kemco-snapshot.test.cjs'
          if ($standard -contains $kemcoSnapshot) {
            $standard = @($standard | Where-Object { $_ -ne $kemcoSnapshot })
            Invoke-ForegroundBatch 'kemco-snapshot' @($kemcoSnapshot) 1
          }
          # Run the two timeout-prone child-process fixtures before concurrent test batches.
          if ($isolated.Count) {
            Invoke-ForegroundBatch 'isolated' $isolated 1
          }
          # The real-time reader replay needs regular browser samples even while the runner is busy.
          if ($replay.Count) {
            Invoke-ForegroundBatch 'replay' $replay 1
          }
          # Headless browser tests stream in the foreground one at a time while non-browser tests run in the background.
          if ($browser.Count -and $standard.Count) {
            $stdConcurrency = [Math]::Max(1, $parallelism - 1)
            $bg = Start-BackgroundBatch 'standard' $standard $stdConcurrency
            $fgCompleted = $false
            try {
              Invoke-ForegroundBatch 'browser' $browser 1
              $fgCompleted = $true
            } finally {
              if (-not $fgCompleted -and -not $bg.Process.HasExited) {
                try { $bg.Process.Kill($true) } catch { try { $bg.Process.Kill() } catch {} }
              }
              Complete-BackgroundBatch $bg
            }
          } elseif ($browser.Count) {
            Invoke-ForegroundBatch 'browser' $browser 1
          } elseif ($standard.Count) {
            Invoke-ForegroundBatch 'standard' $standard $parallelism
          }

          # One more try for the files that are known to be timing-sensitive on a shared runner (headless Edge, the real-time
          # replay, a throttled local HTTP server, the C# compiler, software WebGL). This is not for tests in general: a failure
          # in any other file, or one that cannot be tied to a file, fails the job as before. Only the failed files run again,
          # alone and one at a time, after every other lane has finished, so the machine is quiet. The retry is never silent: a
          # FLAKY-RETRY line in the log, a warning annotation and a row in the job summary name each file, and a file that fails
          # twice fails the job. The list and the numbers behind it are in the pull request that added this block.
          $flakyFiles = @(
            'validation/games-regression.test.cjs', 'validation/setup-download.test.cjs', 'validation/torch-render-temp.test.cjs',
            'validation/home-card-motion.test.cjs', 'validation/unity-kemco-snapshot.test.cjs', 'validation/reader-notice-layout.test.cjs',
            'validation/altt-panel-contrast.test.cjs', 'validation/mychip-layout.test.cjs', 'validation/cardinal-cdp.test.cjs',
            'validation/window-chrome.test.cjs', 'validation/learning-theme-layout.test.cjs', 'validation/library-switch-motion.test.cjs',
            'validation/lookup-card-size.test.cjs', 'validation/kana-best-score.test.cjs', 'validation/sentence-voice-label.test.cjs',
            'validation/v4-settings-live-sync.test.cjs', 'validation/words-delete-empty-state.test.cjs', 'validation/reader-opening-notice.test.cjs'
          )
          if ($failed -and -not $batchErrors.Count) {
            $failedFiles = [System.Collections.Generic.HashSet[string]]::new()
            $unmapped = 0
            $pending = $false
            foreach ($line in [System.IO.File]::ReadLines((Get-Item -LiteralPath test-output.txt).FullName)) {
              if ($line -match '^\s*not ok \d+') {
                if ($pending) { $unmapped++ }
                $pending = $true
              } elseif ($pending -and $line -match "location: '[^']*validation\\+([A-Za-z0-9._-]+\.test\.cjs)") {
                [void]$failedFiles.Add("validation/$($Matches[1])")
                $pending = $false
              }
            }
            if ($pending) { $unmapped++ }
            $retry = @($failedFiles | Where-Object { $_ -in $flakyFiles } | Sort-Object)
            if ($unmapped -eq 0 -and $failedFiles.Count -gt 0 -and $retry.Count -eq $failedFiles.Count -and $retry.Count -le 4) {
              foreach ($f in $retry) {
                Write-Host "FLAKY-RETRY: $f failed on its first run and is run again on its own"
                Add-Content -LiteralPath test-output.txt -Value "FLAKY-RETRY: $f"
              }
              $failed = $false
              Invoke-ForegroundBatch 'retry' @($retry | ForEach-Object { $_.Replace('/', '\') }) 1
              $verdict = if ($failed) { 'failed again' } else { 'passed on the retry' }
              foreach ($f in $retry) {
                $level = if ($failed) { 'error' } else { 'warning' }
                Write-Host "::$level title=Flaky test retried::$f failed on its first run and $verdict"
                if ($env:GITHUB_STEP_SUMMARY) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "| flaky retry | shard ${{ matrix.shard }} | $f | $verdict |" }
              }
            }
          }

          # Keep the same artifact format for tools/test-shards.cjs --update.
          ConvertTo-Json -InputObject $timings | Set-Content -LiteralPath test-file-times.json
          if ($batchErrors.Count) { throw ($batchErrors -join '; ') }
          if ($failed) { throw 'Tests failed' }
          "Ran $count tests"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-file-times-${{ matrix.shard }}
          path: test-file-times.json
          if-no-files-found: warn
          retention-days: 14

  full-build:
    name: Full Build.ps1 -Check (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Environment preflight
        shell: pwsh
        run: ./tools/check-env.ps1
      - name: Build and test
        shell: pwsh
        run: ./Build.ps1 -Check
      - uses: actions/upload-artifact@v4
        with:
          name: MeguLit-exe
          path: MeguLit.exe
