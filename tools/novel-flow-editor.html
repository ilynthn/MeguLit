<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书架流参数</title>
<link rel="stylesheet" href="/web/theme.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
  [hidden] { display: none !important; }
  body:has(#editor:not([hidden])) {
    color: #2e302b;
    background: #f5f4ee;
  }
  #editor { min-height: 100vh; display: grid; grid-template-columns: 290px minmax(0, 1fr); }
  .controls { padding: 25px 21px; border-right: 1px solid #d9d8d0; }
  .controls h1 { margin: 0; font: 600 25px/1.35 var(--t-serif, serif); }
  .controls p { margin: 8px 0 18px; color: #54584c; font-size: 13px; }
  #fields { display: grid; gap: 10px; margin: 18px 0 20px; }
  .field { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13px; }
  output { font-variant-numeric: tabular-nums; color: #505843; }
  input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: #536045; }
  .actions { display: flex; gap: 8px; }
  button { font: inherit; }
  .actions button {
    border: 0; border-radius: 8px; background: #e5e5db; padding: 7px 11px; color: #30352b; cursor: pointer;
  }
  .actions button:first-child { background: #48543c; color: #fff; }
  .actions button:disabled { opacity: .55; cursor: default; }
  #status { min-height: 2.8em; }
  .boundary-label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .boundary-label input { accent-color: #536045; }
  .controls #bounds-status { margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  iframe { width: 100%; height: 100%; min-height: 560px; display: block; border: 0; }
  #preview { height: 100dvh; overflow: auto; }
  body:has(#preview:not([hidden])) {
    --text: var(--t-text);
    min-height: 100vh;
    background: radial-gradient(ellipse at 70% 5%, #e2ede2, transparent 70%), linear-gradient(120deg, #f2ebe1, #d9d6df);
    color: var(--text);
  }
  @media (max-width: 720px) {
    #editor { display: flex; flex-direction: column-reverse; }
    .controls { border-right: 0; border-top: 1px solid #d9d8d0; }
    iframe { height: 540px; min-height: 0; }
  }
</style>
</head>
<body>
<div id="editor" hidden>
  <aside class="controls">
    <h1>书架流参数</h1>
    <p>用滚轮浏览书本。拖动滑块可实时预览。</p>
    <label class="boundary-label"><input type="checkbox" id="bounds" checked> 显示移动边界</label>
    <p id="bounds-status"></p>
    <form>
      <div id="fields"></div>
      <div class="actions">
        <button type="submit" disabled>保存到文库</button>
        <button type="button" id="defaults" disabled>恢复默认</button>
      </div>
      <p id="status" role="status">正在载入参数…</p>
    </form>
  </aside>
  <iframe title="书架流预览"></iframe>
</div>
<main id="preview" hidden></main>
<script type="module">
  import { applyShelfFlowSettings } from '/web/novel-shelf.js';

  const editor = document.querySelector('#editor');
  const preview = document.querySelector('#preview');
  const readJson = async (url, options) => {
    const response = await fetch(url, options);
    const value = await response.json();
    if (!response.ok) throw new Error(value.error);
    return value;
  };

  if (location.pathname === '/preview') {
    for (const file of ['app.css', 'home-layout.css', 'reception.css', 'detail.css', 'e255-polish.css']) {
      const sheet = document.createElement('link');
      sheet.rel = 'stylesheet';
      sheet.href = '/web/' + file;
      document.head.insertBefore(sheet, document.querySelector('link[href="/web/theme.css"]'));
    }
    document.documentElement.dataset.theme = 'light';
    preview.hidden = false;
    localStorage.setItem('megulit-novel-view', 'flow');
    const { mountNovel } = await import('/web/novel-page.js');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
    await mountNovel(preview, {
      esc,
      toast: message => { preview.title = message; },
      api: (action, payload) => {
        if (action === 'novel_shelf') return readJson('/books');
        if (action === 'novel_detail') {
          const query = new URLSearchParams({ id: payload.id });
          if (payload.preview) query.set('preview', '');
          return readJson('/books?' + query);
        }
        return Promise.reject(new Error('请在桌面文库操作'));
      },
      invoke: () => Promise.reject(new Error('请在桌面文库操作'))
    });
  } else {
    editor.hidden = false;
    const frame = editor.querySelector('iframe');
    const form = editor.querySelector('form');
    const container = editor.querySelector('#fields');
    const save = editor.querySelector('button[type="submit"]');
    const reset = editor.querySelector('#defaults');
    const status = editor.querySelector('#status');
    const showBounds = editor.querySelector('#bounds');
    const boundsStatus = editor.querySelector('#bounds-status');
    let controls;
    let observer;
    const layoutObserver = new ResizeObserver(updateBounds);
    let observedFlow;
    const values = () => Object.fromEntries(controls.map(({ field, input }) => [field.key, input.valueAsNumber]));

    function updatePreview() {
      const flow = frame.contentDocument?.querySelector('.nv-flow');
      if (controls && flow) applyShelfFlowSettings(flow, values());
      observedFlow = flow;
      layoutObserver.disconnect();
      if (flow) {
        layoutObserver.observe(flow);
        layoutObserver.observe(flow.parentElement);
      }
      updateBounds();
    }

    function updateBounds() {
      const panel = observedFlow?.parentElement;
      panel?.toggleAttribute('data-nv-bounds', showBounds.checked);
      if (!panel || !showBounds.checked) { boundsStatus.textContent = ''; return; }
      const width = Math.round(observedFlow.getBoundingClientRect().width);
      const height = Math.round(observedFlow.getBoundingClientRect().height);
      boundsStatus.textContent = `边界 ${panel.clientWidth} × ${panel.clientHeight} px · 书流 ${width} × ${height} px`;
    }

    frame.addEventListener('load', () => {
      observer?.disconnect();
      layoutObserver.disconnect();
      observer = new MutationObserver(() => {
        if (frame.contentDocument.querySelector('.nv-flow') !== observedFlow) updatePreview();
      });
      observer.observe(frame.contentDocument, { childList: true, subtree: true });
      updatePreview();
    });
    frame.src = '/preview';
    showBounds.addEventListener('change', updateBounds);

    try {
      const { fields, settings } = await readJson('/settings');
      controls = fields.map(field => {
        const label = document.createElement('label');
        label.className = 'field';
        const text = document.createElement('span');
        text.textContent = field.label;
        const output = document.createElement('output');
        const input = document.createElement('input');
        input.type = 'range';
        input.name = field.key;
        input.id = 'setting-' + field.key;
        input.setAttribute('aria-label', field.label);
        output.htmlFor = input.id;
        input.min = field.min;
        input.max = field.max;
        input.step = field.step;
        const update = value => {
          input.value = value;
          output.value = input.value + ' ' + field.unit;
        };
        update(settings[field.key]);
        label.append(text, output, input);
        container.append(label);
        return { field, input, update };
      });
      save.disabled = false;
      reset.disabled = false;
      status.textContent = '';
      updatePreview();
    } catch (error) {
      status.textContent = error.message;
    }

    form.addEventListener('input', event => {
      const control = controls.find(({ input }) => input === event.target);
      if (control) control.update(control.input.value);
      updatePreview();
      status.textContent = '预览已更新，待保存。';
    });
    reset.addEventListener('click', () => {
      controls.forEach(({ field, update }) => update(field.value));
      updatePreview();
      status.textContent = '已预览默认参数，待保存。';
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      save.disabled = true;
      const draft = JSON.stringify(values());
      try {
        await readJson('/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: draft });
        status.textContent = draft === JSON.stringify(values())
          ? '已保存。重新进入桌面文库即可应用。' : '已保存先前参数，新调整待保存。';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        save.disabled = false;
      }
    });
  }
</script>
</body>
</html>
