# E377 MeguLit relay (Cloudflare Worker + D1 + R2). Deploy steps: README.md in this folder.
# No secrets here: GITHUB_TOKEN, LINK_SECRET, HASH_SALT (and optional DIAG_TOKEN, REPORT_REPO, REPORT_TOKEN, ADMIN_TOKEN for 交流 deletes) are set with `wrangler secret put`.
name = "megulit-relay"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

# Custom domain: replace api.megulit.com with the real host (its zone must be on this Cloudflare account).
# Top-level key: keep it above the first [table] below.
routes = [
  { pattern = "api.megulit.com", custom_domain = true }
]

[vars]
# Exact-version ordinary Seed signer. Set the HTTPS gateway and its matching public keys
# at deployment, and provision ORDINARY_SCAN_TOKEN with wrangler secret put.
ORDINARY_SCAN_URL = "https://megulit-ordinary-scan.egu-it--it.workers.dev/scan"
ORDINARY_PUBLIC_KEYS = '[{"id":"ordinary-windows-01","alg":"ed25519","publicKey":"MCowBQYDK2VwAyEAooGygGN5ckXDPPv408UDa9UJiEvPVGYF9UoOeodGexY="}]'
# Public trust only; private signing material stays in the local DPAPI store
PROFILE_PUBLIC_KEYS = '[{"id":"seed-publisher-20261122","alg":"ed25519","publicKey":"MCowBQYDK2VwAyEAQUS2OCwp7pAFytVwXx/C5lU90TW4+BpJVB0NMx5Rw+U="}]'
TORCH_RELEASE_PUBLIC_KEYS = '[{"id":"seed-publisher-20261122","alg":"ed25519","publicKey":"MCowBQYDK2VwAyEAQUS2OCwp7pAFytVwXx/C5lU90TW4+BpJVB0NMx5Rw+U="}]'
CARDINAL_REVIEW_PUBLIC_KEYS = '[{"id":"seed-reviewer-20261122","alg":"ed25519","publicKey":"MCowBQYDK2VwAyEAGhFzVt5Ps4h3Mkv2Ei1SFT/BLHBP4U4Nok6cOSLBtcc="}]'
FORCE_UPDATE_ENABLED = "false"
# Enable only after 1.4.23 is published AND its cn-dl/dl mirrors are downloadable
MIN_APP_VERSION_OVERRIDE = ""
GITHUB_REPO = "ilynthn/MeguLit"
LINK_DAYS = "30"
# the website forms (src/feedback.js) post from these origins
# 2026-11-27 cn.megulit.com (EdgeOne) serves the same site, incl. the /me/ user centre
ALLOWED_ORIGINS = "https://megulit.com,https://www.megulit.com,https://cn.megulit.com"
# E379 avatars and weekly hot words (src/community.js)
AVATAR_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
HOT_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
HOT_MIN_USERS = "3"
REPORT_THRESHOLD = "3"
# 2026-11-21 Cardinal (src/cardinal.js): an auto diff becomes verified with >= VERIFY_VOTERS different reporters, mean total >= VERIFY_MEAN and no vote
# below VERIFY_FLOOR; mean < REPAIR_MEAN (with >= REPAIR_VOTERS reporters) sends it to the repair queue; votes under MIN_LINES lines do not count.
CARDINAL_VERIFY_VOTERS = "3"
CARDINAL_VERIFY_MEAN = "0.9"
CARDINAL_VERIFY_FLOOR = "0.6"
CARDINAL_REPAIR_MEAN = "0.6"
CARDINAL_REPAIR_VOTERS = "3"
CARDINAL_MIN_LINES = "30"
# E415 日报 sources whose full article text the relay may cache (only with the site's permission), comma separated
# source ids: moepedia, 4gamer, denfami. Empty = the app fetches articles on the user's PC.
NEWS_FULLTEXT_SOURCES = ""
# E415 one-line Chinese notes for the daily hot words
# DAILY_GLOSS_MODEL = "…" would be tried before the built-in chain (src/daily.js GLOSS_CHAIN). DeepSeek V4 needs the paid Workers plan.

# Workers AI: avatar moderation and the AI guesses on the hot-word awards. No token needed inside the Worker.
[ai]
binding = "AI"

# Monday 00:00 UTC+8 = Sunday 16:00 UTC: settle last week's hot words.
[triggers]
# and every 30 minutes: website feedback still waiting for its GitHub issue (src/feedback.js)
# E415 once a day at 06:20 Japan time: Galgame / ACG news and today's hot words for the 日报 page (src/daily.js)
# 2026-11-28 once a day at 05:40 Japan time: 作品榜 rankings from VNDB / Bangumi / AniList (src/charts.js)
crons = ["0 16 * * SUN", "*/30 * * * *", "20 21 * * *", "40 20 * * *"]

# Filled in from `wrangler d1 create megulit-relay` (copy the database_id it prints).
[[d1_databases]]
binding = "DB"
database_name = "megulit-relay"
database_id = "03e277c6-6923-4dd3-9e41-287a3d35bbea"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "megulit-diagnostics"

[observability]
enabled = true

# 2026-11-13 Cloudflare rate limiting bindings: the short, high-traffic windows no longer write a D1 row per request
# (D1 free tier is 100,000 rows_written a day). Limits must match RATE in src/worker.js; period is 10 or 60 only.
# namespace_id is any number unique within this Worker; changing one resets its counters.
[[unsafe.bindings]]
name = "RL_IP"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_LB_GET"
type = "ratelimit"
namespace_id = "1002"
# 2026-11-28 120 (was 60): readers behind one shared IP (campus / CGNAT) switching tabs were refused; the app now
# asks once per period through /api/leaderboard/boards and caches, so this only stops real abuse
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_AVATAR_GET"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[unsafe.bindings]]
name = "RL_HOT"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_DAILY"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_DAILY_IMG"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 240, period = 60 }

[[unsafe.bindings]]
name = "RL_RELEASE"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RL_SOCIAL_GET"
type = "ratelimit"
namespace_id = "1008"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_FORUM_GET"
type = "ratelimit"
namespace_id = "1009"
simple = { limit = 120, period = 60 }

# 2026-11-27 website (read-only session) sync reads, per account: no D1 row per request
[[unsafe.bindings]]
name = "RL_SYNC_GET"
type = "ratelimit"
namespace_id = "1010"
simple = { limit = 60, period = 60 }

[[durable_objects.bindings]]
name = "SEED_NOTIFICATIONS"
class_name = "SeedNotifications"

[[migrations]]
tag = "seed-notifications-v1"
new_sqlite_classes = ["SeedNotifications"]
