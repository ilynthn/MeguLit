# E377 MeguLit relay (Cloudflare Worker + D1 + R2). Deploy steps: README.md in this folder.
# No secrets here: GITHUB_TOKEN, LINK_SECRET, HASH_SALT (and optional DIAG_TOKEN, REPORT_REPO, REPORT_TOKEN, ADMIN_TOKEN for 交流 deletes) are set with `wrangler secret put`.
name = "megulit-relay"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

# Custom domain: replace api.megulit.com with the real host (its zone must be on this Cloudflare account).
# Top-level key: keep it above the first [table] below.
routes = [
  { pattern = "api.megulit.com", custom_domain = true }
]

[vars]
GITHUB_REPO = "ilynthn/MeguLit"
LINK_DAYS = "30"
# the website forms (src/feedback.js) post from these origins
ALLOWED_ORIGINS = "https://megulit.com,https://www.megulit.com"
# E379 avatars and weekly hot words (src/community.js)
AVATAR_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
HOT_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
HOT_MIN_USERS = "3"
REPORT_THRESHOLD = "3"
# E415 日报 sources whose full article text the relay may cache (only with the site's permission), comma separated
# source ids: moepedia, 4gamer, denfami. Empty = the app fetches articles on the user's PC.
NEWS_FULLTEXT_SOURCES = ""
# E415 one-line Chinese notes for the daily hot words
# DAILY_GLOSS_MODEL = "…" would be tried before the built-in chain (src/daily.js GLOSS_CHAIN). DeepSeek V4 needs the paid Workers plan.

# Workers AI: avatar moderation and the AI guesses on the hot-word awards. No token needed inside the Worker.
[ai]
binding = "AI"

# Monday 00:00 UTC+8 = Sunday 16:00 UTC: settle last week's hot words.
[triggers]
# and every 30 minutes: website feedback still waiting for its GitHub issue (src/feedback.js)
# E415 once a day at 06:20 Japan time: Galgame / ACG news and today's hot words for the 日报 page (src/daily.js)
crons = ["0 16 * * SUN", "*/30 * * * *", "20 21 * * *"]

# Filled in from `wrangler d1 create megulit-relay` (copy the database_id it prints).
[[d1_databases]]
binding = "DB"
database_name = "megulit-relay"
database_id = "03e277c6-6923-4dd3-9e41-287a3d35bbea"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "megulit-diagnostics"

[observability]
enabled = true

# 2026-11-13 Cloudflare rate limiting bindings: the short, high-traffic windows no longer write a D1 row per request
# (D1 free tier is 100,000 rows_written a day). Limits must match RATE in src/worker.js; period is 10 or 60 only.
# namespace_id is any number unique within this Worker; changing one resets its counters.
[[unsafe.bindings]]
name = "RL_IP"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_LB_GET"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_AVATAR_GET"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 600, period = 60 }

[[unsafe.bindings]]
name = "RL_HOT"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_DAILY"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_DAILY_IMG"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 240, period = 60 }

[[unsafe.bindings]]
name = "RL_RELEASE"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RL_SOCIAL_GET"
type = "ratelimit"
namespace_id = "1008"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_FORUM_GET"
type = "ratelimit"
namespace_id = "1009"
simple = { limit = 120, period = 60 }
